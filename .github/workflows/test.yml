name: Test Pipeline

on:
  push:
    branches:
        - master

jobs:
   test:

    runs-on: ubuntu-latest

    steps:

        - name: checkout code
          uses: actions/checkout@v4


        - name: install python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        
        - name: install deps
          run: |
            pip install -r requirements.txt
            
            
        - name: run tests
          run: |
            pytest tests/